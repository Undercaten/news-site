<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VashiNews</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Темный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        /* Плавное раскрытие дополнительных источников */
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: slideRight 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-black text-gray-300 min-h-screen flex font-sans antialiased overflow-x-hidden">

    <!-- Боковая шторка (Скрыта на мобильных по умолчанию) -->
    <aside id="sidebar" class="w-64 bg-zinc-950 border-r border-zinc-900 fixed inset-y-0 left-0 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl">
        <div class="p-5 flex justify-between items-center border-b border-zinc-900">
            <h1 class="text-xl font-bold text-white tracking-wide">VashiNews</h1>
            <button id="close-btn" class="md:hidden text-zinc-500 hover:text-white text-2xl">&times;</button>
        </div>
        <nav class="p-4 space-y-2">
            <button onclick="filterNews('Все')" class="w-full text-left px-4 py-2 rounded-lg bg-zinc-900 text-white font-medium hover:bg-zinc-800 transition">🌍 Все новости</button>
            <button onclick="filterNews('Политика')" class="w-full text-left px-4 py-2 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white transition">🏛 Политика</button>
            <button onclick="filterNews('Технологии')" class="w-full text-left px-4 py-2 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white transition">💻 Технологии</button>
            <button onclick="filterNews('Общество')" class="w-full text-left px-4 py-2 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white transition">👥 Общество</button>
            <button onclick="filterNews('Наука')" class="w-full text-left px-4 py-2 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white transition">🔬 Наука</button>
        </nav>
    </aside>

    <!-- Затемнение фона на мобильных при открытой шторке -->
    <div id="overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Основной контент -->
    <main class="flex-1 md:ml-64 flex flex-col min-h-screen">
        <header class="sticky top-0 z-20 bg-black/80 backdrop-blur-md border-b border-zinc-900 p-4 flex items-center gap-4">
            <button id="menu-btn" class="md:hidden text-zinc-400 hover:text-white">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h2 id="current-category" class="text-lg font-semibold text-white">Все новости</h2>
        </header>

        <div class="p-4 sm:p-6 flex-1">
            <div id="news-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6">
                <!-- Карточки генерируются здесь -->
            </div>
        </div>
    </main>

    <script>
        let allNews = [];

        // Управление шторкой
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Форматирование времени
        function timeAgo(timestamp) {
            const diff = Math.floor((Date.now() / 1000) - timestamp);
            if (diff < 3600) return `${Math.floor(diff / 60)} мин назад`;
            return `${Math.floor(diff / 3600)} ч назад`;
        }

        // Отрисовка карточек
        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            if (newsArray.length === 0) {
                container.innerHTML = '<p class="text-zinc-500">В этой категории пока нет новостей.</p>';
                return;
            }

            newsArray.forEach(item => {
                const mainArticle = item.articles[0];
                const otherArticles = item.articles.slice(1);
                
                let sourcesHtml = '';
                if (otherArticles.length > 0) {
                    const linksHtml = otherArticles.map(a => 
                        `<a href="${a.link}" target="_blank" class="block py-2 text-sm text-zinc-400 hover:text-blue-400 border-t border-zinc-800 transition pl-4">
                            ↳ ${a.source}: ${a.title}
                        </a>`
                    ).join('');
                    
                    sourcesHtml = `
                        <details class="mt-3 group">
                            <summary class="text-sm font-medium text-blue-500 hover:text-blue-400 select-none flex items-center gap-1">
                                <svg class="w-4 h-4 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                Еще ${otherArticles.length} источника
                            </summary>
                            <div class="mt-2 pl-2 border-l-2 border-zinc-800">
                                ${linksHtml}
                            </div>
                        </details>
                    `;
                }

                const card = `
                    <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-5 hover:border-zinc-700 transition-colors shadow-lg flex flex-col h-full">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold px-2 py-1 bg-zinc-900 text-zinc-400 rounded">${item.category}</span>
                            <span class="text-xs text-zinc-500">${timeAgo(item.added_at)}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2 leading-snug">
                            <a href="${mainArticle.link}" target="_blank" class="hover:text-blue-400 transition">${item.theme}</a>
                        </h3>
                        <p class="text-sm text-zinc-500 mb-4">${mainArticle.source}</p>
                        <div class="mt-auto">
                            ${sourcesHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Фильтрация
        window.filterNews = function(category) {
            document.getElementById('current-category').innerText = category === 'Все' ? 'Все новости' : category;
            if (window.innerWidth < 768) toggleSidebar();
            
            if (category === 'Все') {
                renderNews(allNews);
            } else {
                renderNews(allNews.filter(n => n.category === category));
            }
        };

        // Инициализация
        async function fetchNews() {
            try {
                const res = await fetch('/news_data.json');
                allNews = await res.json();
                renderNews(allNews);
            } catch (e) {
                console.error('Ошибка загрузки новостей', e);
            }
        }

        fetchNews();
    </script>
</body>
</html>
