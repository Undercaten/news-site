<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объектив | Нейтральный агрегатор новостей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-4xl mx-auto p-4 py-8">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-4xl font-bold text-gray-900 tracking-tight">Объектив</h1>
            <p class="text-gray-500 mt-2">Мультиперспективный новостной агрегатор. Показаны только те темы, о которых написали не менее 3-х разных изданий.</p>
        </header>

        <div id="loading" class="text-center py-10 text-gray-500 animate-pulse">
            Синхронизация с сервером...
        </div>

        <div id="news-container" class="space-y-8"></div>
    </div>

    <script>
        // Функция для правильного склонения слова "источник"
        function getPlural(number, one, two, five) {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) { return five; }
            n %= 10;
            if (n === 1) { return one; }
            if (n >= 2 && n <= 4) { return two; }
            return five;
        }

        async function loadNews() {
            try {
                const response = await fetch('/news_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Данные еще не собраны');
                
                const topics = await response.json();
                const container = document.getElementById('news-container');
                document.getElementById('loading').style.display = 'none';
                container.innerHTML = '';

                if (topics.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">В данный момент нет активных тем с пересечением в 3+ источниках.</p>';
                    return;
                }

                topics.forEach(topic => {
                    const topicCard = document.createElement('div');
                    topicCard.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';
                    
                    const topicHeader = document.createElement('div');
                    topicHeader.className = 'bg-gray-100 px-6 py-4 border-b border-gray-200 flex justify-between items-center';
                    topicHeader.innerHTML = `
                        <h2 class="text-xl font-semibold text-gray-800">${topic.theme}</h2>
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Всего источников: ${topic.articles.length}</span>
                    `;
                    topicCard.appendChild(topicHeader);

                    const articleList = document.createElement('ul');
                    articleList.className = 'divide-y divide-gray-100';

                    topic.articles.forEach((article, index) => {
                        const li = document.createElement('li');
                        li.className = 'px-6 py-4 hover:bg-gray-50 transition-colors';
                        
                        // Скрываем все статьи после 3-й
                        if (index >= 3) {
                            li.classList.add('hidden', 'extra-article');
                        }
                        
                        li.innerHTML = `
                            <a href="${article.link}" target="_blank" class="block">
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 mb-1 block">${article.source}</span>
                                <h3 class="text-gray-900">${article.title}</h3>
                            </a>
                        `;
                        articleList.appendChild(li);
                    });

                    topicCard.appendChild(articleList);

                    // Если статей больше 3, добавляем кнопку "Ещё"
                    if (topic.articles.length > 3) {
                        const hiddenCount = topic.articles.length - 3;
                        const word = getPlural(hiddenCount, 'источник', 'источника', 'источников');
                        
                        const toggleContainer = document.createElement('div');
                        toggleContainer.className = 'border-t border-gray-100 bg-gray-50';
                        
                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'w-full py-3 text-sm font-semibold text-indigo-600 hover:text-indigo-800 hover:bg-gray-100 transition-colors focus:outline-none';
                        toggleBtn.innerText = `Показать ещё ${hiddenCount} ${word} ↓`;
                        
                        let isExpanded = false;
                        toggleBtn.onclick = () => {
                            isExpanded = !isExpanded;
                            const extraItems = articleList.querySelectorAll('.extra-article');
                            extraItems.forEach(item => {
                                if (isExpanded) {
                                    item.classList.remove('hidden');
                                } else {
                                    item.classList.add('hidden');
                                }
                            });
                            toggleBtn.innerText = isExpanded ? 'Свернуть ↑' : `Показать ещё ${hiddenCount} ${word} ↓`;
                        };
                        
                        toggleContainer.appendChild(toggleBtn);
                        topicCard.appendChild(toggleContainer);
                    }

                    container.appendChild(topicCard);
                });
            } catch (error) {
                // Игнорируем ошибку при пустом запуске, ждем данные от бекенда
            }
        }
        
        loadNews();
        setInterval(loadNews, 60000); // Автообновление страницы раз в минуту
    </script>
</body>
</html>
